name: cultural-eval
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # PyTorch with CUDA 11.8 — swap cuda-version for your driver
  - pytorch>=2.1.0
  - torchvision
  - pytorch-cuda=11.8

  # Scientific stack
  - numpy>=1.26.0
  - scikit-learn>=1.4.0

  # System
  - psutil>=5.9.0

  - pip:
    # HuggingFace ecosystem
    - transformers>=4.40.0
    - datasets>=2.18.0
    - sentence-transformers>=2.7.0

    # LLM inference (GPU required)
    - vllm>=0.4.0

    # NLP metrics
    - spacy>=3.7.0
    - nltk>=3.8.0
    - rouge-score>=0.1.2
    - sacrebleu>=2.3.0
    - bert-score>=0.3.13

    # API clients
    - openai>=1.30.0
    - google-auth>=2.29.0
    - google-auth-httplib2>=0.2.0
